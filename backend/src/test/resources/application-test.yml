spring:
  datasource:
    url: jdbc:h2:mem:portfolio;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  auth:
    reset:
      expose-token: true
  profile:
    media:
      storage-path: target/test-media
      max-image-size: 2MB
      max-pdf-size: 2MB
